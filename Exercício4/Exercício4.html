<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h2>Contatos</h2>
  <input id="nome" type="text" placeholder="Nome">
  <input id="telefone" type="text" placeholder="Telefone">
  <button id="cadastrar">Cadastrar</button>
  <ul id="lista"></ul>

  <script>
    let contatos = [];
    const nome = document.querySelector("#nome");
    const telefone = document.getElementById
      ("telefone");
    const lista = document.getElementsByTagName("lista")[0];
    const botao = document.getElementById("cadastrar");

    botao.addEventListener("click", cadastrarContato());

    function cadastrarContato() {
      let contato = {
        nome: nome.value
      telefone: telefone.value
      };
      botao.addEventListener("click", cadastrarContato());
      //console.log(nome.value);
      //console.log(telefone.value);
      contatos.push(contato);

      mostrarContatos();

    }

    function.mostrarContatos(){
      let item = document.createElement("li");
      item.textContent = contato.nome + "-"
        + contato.telefone;

      lista.appendChild("item");
    }
  </script>
</body>

</html>
