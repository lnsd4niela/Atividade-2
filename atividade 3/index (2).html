<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 30px;
            background: #1f1720;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            margin: auto;

            display: grid;

          
            grid-template-columns: 1fr 3fr;

           
            grid-template-rows: 0.6fr 3fr 2fr 1.2fr;

            gap: 6px;

            padding: 6px;

            background: #f8dce8;
            border-radius: 8px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 7px;
            border: 2px solid #f7e6ed;

            color: #702b4d;
            font-weight: bold;
            font-size: 15px;

            text-transform: uppercase;
        }

        .navbar {
            grid-column: 1 / 3;
            grid-row: 1;

            background: #e8a9c3;
        }

        .sidebar {
            grid-column: 1;
            grid-row: 2 / 5;

            background: #e5a1bd;
        }

        .main {
            grid-column: 2;
            grid-row: 2;

            background: #efbfd2;
        }

        .content1 {
            grid-column: 2;
            grid-row: 3;

            background: #f3c9d9;
        }

        .content2 {
            grid-column: 2;
            grid-row: 3;

            background: #edb6cd;
        }

        .content3 {
            grid-column: 2;
            grid-row: 3;

            background: #e9acc5;
        }

        .contents {
            grid-column: 2;
            grid-row: 3;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .content {
            display: flex;
            align-items: center;
            justify-content: center;

            background: #efbfd2;
            border: 2px solid #f7e6ed;
            border-radius: 7px;

            color: #702b4d;
            font-weight: bold;
            font-size: 15px;
            text-transform: uppercase;
        }

        .content:nth-child(1) {
            background: #f3c9d9;
        }

        .content:nth-child(2) {
            background: #edb6cd;
        }

        .content:nth-child(3) {
            background: #e7aac3;
        }

        .footer {
            grid-column: 2;
            grid-row: 4;

            background: #dfa0bb;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .container {
                height: auto;
                min-height: 100vh;

                grid-template-columns: 1fr;
                grid-template-rows:
                    70px
                    180px
                    250px
                    150px
                    70px;
            }

            .navbar {
                grid-column: 1;
                grid-row: 1;
            }

            .sidebar {
                grid-column: 1;
                grid-row: 2;
            }

            .main {
                grid-column: 1;
                grid-row: 3;
            }

            .contents {
                grid-column: 1;
                grid-row: 4;

                grid-template-columns: repeat(3, 1fr);
            }

            .footer {
                grid-column: 1;
                grid-row: 5;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="item navbar">
            NAVBAR
        </div>

        <div class="item sidebar">
            SIDEBAR
        </div>

        <div class="item main">
            MAIN
        </div>

        <div class="contents">
            <div class="content">
                CONTENT 1
            </div>

            <div class="content">
                CONTENT 2
            </div>

            <div class="content">
                CONTENT 3
            </div>
        </div>

        <div class="item footer">
            FOOTER
        </div>

    </div>

</body>
</html>
